<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="FluxDM">
  <defs>
    <linearGradient id="bg-grad" x1="14" y1="10" x2="114" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="48%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="bg-highlight" x1="64" y1="8" x2="64" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="stream-grad" x1="64" y1="24" x2="64" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="arrow-grad" x1="64" y1="30" x2="64" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#042f2e" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Base rounded squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" ry="28" fill="url(#bg-grad)"/>
  <rect x="8.75" y="8.75" width="110.5" height="110.5" rx="27.25" ry="27.25" fill="none" stroke="url(#bg-highlight)" stroke-width="1.5"/>

  <!-- Subtle ambient glow accents -->
  <circle cx="98" cy="28" r="34" fill="#38bdf8" fill-opacity="0.16"/>
  <circle cx="28" cy="102" r="28" fill="#2dd4bf" fill-opacity="0.14"/>

  <!-- Foreground emblem: parallel stream bars + downward arrow + base bar -->
  <g filter="url(#soft-shadow)">
    <!-- Parallel segmented stream bars (left and right channels) -->
    <rect x="33" y="30" width="8" height="24" rx="4" fill="url(#stream-grad)" opacity="0.82"/>
    <rect x="33" y="59" width="8" height="11" rx="4" fill="#cffafe" opacity="0.9"/>

    <rect x="46" y="24" width="8" height="34" rx="4" fill="url(#stream-grad)" opacity="0.92"/>

    <rect x="74" y="24" width="8" height="34" rx="4" fill="url(#stream-grad)" opacity="0.92"/>

    <rect x="87" y="30" width="8" height="16" rx="4" fill="url(#stream-grad)" opacity="0.82"/>
    <rect x="87" y="51" width="8" height="19" rx="4" fill="#cffafe" opacity="0.9"/>

    <!-- Central shaft + bold downward arrow head -->
    <path
      d="M59 24 C59 21.24 61.24 19 64 19 C66.76 19 69 21.24 69 24 L69 66 L80.5 66 C84.1 66 85.95 70.32 83.46 72.92 L67.1 89.95 C65.4 91.72 62.6 91.72 60.9 89.95 L44.54 72.92 C42.05 70.32 43.9 66 47.5 66 L59 66 Z"
      fill="url(#arrow-grad)"
    />

    <!-- Bottom tray / progress base bar -->
    <rect x="28" y="97" width="72" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.28"/>
    <rect x="28" y="97" width="50" height="9" rx="4.5" fill="#ffffff"/>
  </g>
</svg>
